name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  language-policy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Verify Wyrm Linguist metadata
      shell: pwsh
      run: |
        $attrs = Get-Content .gitattributes -Raw
        if ($attrs -notmatch '(?m)^\*\.wyr linguist-language=Wyrm\r?$') { throw 'Missing Wyrm language mapping' }
        if ($attrs -notmatch '(?m)^\*\.wyr linguist-detectable=true\r?$') { throw 'Missing Wyrm detectable flag' }
        if ($attrs -notmatch '(?m)^\*\.cpp linguist-vendored=true\r?$') { throw 'Missing C++ vendored flag' }
        $doc = Get-Content docs/github-linguist/README.md -Raw
        if ($doc -notmatch '(?m)^Wyrm:\r?$') { throw 'Missing Wyrm Linguist entry' }
        if ($doc -notmatch '#5B256B') { throw 'Missing Wyrm color #5B256B' }
        if ($doc -notmatch 'tm_scope: source\.wyr') { throw 'Missing Wyrm TextMate scope' }

    - name: Verify repository language ratio
      shell: pwsh
      run: |
        $wyrmBytes = (Get-ChildItem -Recurse -File -Filter *.wyr | Measure-Object Length -Sum).Sum
        $cBytes    = (Get-ChildItem wyrm/lib -Recurse -File -Filter *.c | Measure-Object Length -Sum).Sum
        Write-Host "Wyrm bytes: $wyrmBytes"
        Write-Host "C runtime bytes: $cBytes"
        if ($wyrmBytes -le $cBytes) { throw 'Wyrm source bytes must be greater than C runtime bytes' }
